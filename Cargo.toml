[package]
name = "turbosheet"
version = "0.1.0"
edition = "2021"
description = "TurboSheet - High-performance Rust browser automation for Node.js"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["compat-mode", "napi4", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["full"] }
chromiumoxide = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1"
dashmap = "6"
parking_lot = "0.12"
futures = "0.3"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
base64 = "0.22"
flate2 = "1"
zstd = { version = "0.13", features = ["experimental"], optional = true }
ciborium = { version = "0.2", optional = true }
once_cell = "1"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
], optional = true }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tar = "0.4.46"
zip = "8.6.0"
async-trait = "0.1.89"
dirs = "6.0.0"
geckodriver = "0.37.0"
redis = { version = "1.2", features = ["tokio-comp"], optional = true }
rcgen = "0.14.8"
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
rustls-pki-types = "1.14.1"
tokio-tungstenite = { version = "0.24", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
napi-build = "2"

[features]
default = ["chromium", "traces"]
chromium = ["chromiumoxide"]
firefox = ["bidi"]
webkit = []
bidi = ["tokio-tungstenite"]
traces = ["zstd", "ciborium"]
visual = ["image"]
video = []
swarm = ["redis"]
